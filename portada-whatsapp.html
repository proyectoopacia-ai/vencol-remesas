<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>VENCOL Portada WhatsApp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,600&display=block">
<style>
  :root { --navy-900: #04101f; --navy-800: #071a33; --line: rgba(255,255,255,.14); --gold: #e9b44c; --gold-pale: #f8dc97; --mist: #c9d6e6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 900px; overflow: hidden; background: var(--navy-900); }
  body { font-family: "Montserrat", "Segoe UI", sans-serif; color: #fff; }
  .portada { position: relative; width: 1600px; height: 900px; overflow: hidden;
    background:
      radial-gradient(720px 620px at 19% 42%, #15508f 0%, rgba(21,80,143,0) 72%),
      radial-gradient(700px 600px at 100% 88%, rgba(10,154,80,.26) 0%, rgba(10,154,80,0) 72%),
      linear-gradient(120deg, var(--navy-800), var(--navy-900)); }
  .grid { position: absolute; inset: 0; background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size: 72px 72px; }
  .map { position: absolute; opacity: .15; filter: blur(4px) drop-shadow(0 0 22px rgba(31,206,109,.55)); }
  .map.col { left: -40px; top: 150px; width: 320px; }
  .map.ven { left: 470px; top: 10px; width: 360px; }
  .contenido { position: absolute; left: 0; right: 0; top: 0; bottom: 118px; display: grid; grid-template-columns: 590px 1fr; align-items: center; gap: 48px; padding: 0 60px 0 56px; }
  .logo { display: block; width: 590px; height: 590px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(248,220,151,.35), 0 0 70px rgba(66,160,255,.42), 0 22px 50px rgba(0,0,0,.55); }
  .info { display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: 62px; font-weight: 900; line-height: 1.05; white-space: nowrap; }
  .sub { margin-top: 8px; font-size: 32px; font-style: italic; font-weight: 600; color: var(--mist); }
  .servicios { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .servicio { display: flex; align-items: center; gap: 12px; height: 66px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 16px; background: rgba(12,39,72,.82); font-size: 25px; font-weight: 700; white-space: nowrap; }
  .servicio svg { width: 34px; height: 34px; flex: none; }
  .confianza { display: grid; grid-template-columns: repeat(3, 1fr); }
  .confianza div { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 30px; font-weight: 800; }
  .confianza div + div { border-left: 2px solid rgba(233,180,76,.55); }
  .confianza svg { width: 38px; height: 38px; flex: none; }
  .cta { display: flex; align-items: center; justify-content: center; gap: 16px; height: 92px; border-radius: 46px; background: linear-gradient(180deg, #2fe07f, #0fae59);
    box-shadow: 0 0 0 3px rgba(248,220,151,.75), 0 12px 34px rgba(31,206,109,.42), inset 0 2px 0 rgba(255,255,255,.4); color: #03281a; font-size: 38px; font-weight: 900; white-space: nowrap; }
  .cta svg { width: 52px; height: 52px; flex: none; }
  .pie { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; }
  .pie svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pie p { position: absolute; left: 0; right: 0; top: 48px; text-align: center; color: var(--navy-800); font-size: 42px; font-weight: 800; }
  .tricolor { position: absolute; left: 50%; top: 110px; width: 320px; height: 10px; margin-left: -160px; border-radius: 5px; overflow: hidden; display: flex; }
  .tricolor i { flex: 1; }
</style>
</head>
<body>
<main class="portada">
  <div class="grid"></div>
  <img class="map col" src="assets/mapa-colombia.png" alt="">
  <img class="map ven" src="assets/mapa-venezuela.png" alt="">

  <div class="contenido">
    <img class="logo" src="assets/logo-vencol.png" alt="VENCOL Remesas">
    <div class="info">
      <div>
        <h1>Colombia a Venezuela</h1>
        <p class="sub">Conectando familias sin fronteras</p>
      </div>
      <section class="servicios">
        <div class="servicio">Pago Móvil</div>
        <div class="servicio">Bancolombia</div>
        <div class="servicio">Nequi</div>
        <div class="servicio">Binance</div>
        <div class="servicio">Transferencia inmediata</div>
        <div class="servicio">Atención personalizada</div>
      </section>
      <section class="confianza">
        <div><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M27 3 9 27h13l-3 18 20-26H25z" fill="#39e585"/></svg>Rápido</div>
        <div><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="8" y="21" width="32" height="23" rx="5" fill="#e9b44c"/><path d="M15 21v-7a9 9 0 0 1 18 0v7" stroke="#e9b44c" stroke-width="4.5"/></svg>Seguro</div>
        <div><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#1fce6d"/><path d="m14 25 7 7 13-14" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>Confiable</div>
      </section>
      <div class="cta">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path fill="#03281a" d="M32 4a28 28 0 0 0-24 42L4 60l14.500-3.800A28 28 0 1 0 32 4z"/>
          <path fill="#fff" d="M45.600 37.500c-.7-.4-4.200-2.100-4.900-2.300-.7-.3-1.100-.4-1.600.3-.5.700-1.800 2.300-2.300 2.800-.4.500-.8.500-1.500.2-.7-.4-3-1.100-5.700-3.500-2.100-1.900-3.500-4.200-3.900-4.900-.4-.7 0-1.100.3-1.500.3-.3.700-.8 1.100-1.200.4-.4.500-.7.700-1.200.2-.5.100-.9-.1-1.300-.2-.4-1.600-3.900-2.200-5.300-.6-1.400-1.200-1.200-1.600-1.200h-1.400c-.5 0-1.300.2-1.900.9-.7.700-2.500 2.500-2.500 6s2.600 7 2.900 7.400c.4.500 5.100 7.800 12.300 10.900 1.700.7 3.100 1.200 4.100 1.500 1.700.5 3.300.5 4.500.3 1.400-.2 4.200-1.700 4.800-3.400.6-1.700.6-3.100.4-3.400-.2-.3-.6-.5-1.300-.9z"/>
        </svg>
        Escríbenos por WhatsApp
      </div>
    </div>
  </div>

  <footer class="pie">
    <svg viewBox="0 0 1600 150" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 42 Q800 -28 1600 42 V150 H0 Z" fill="#1fce6d"/>
      <path d="M0 53 Q800 -17 1600 53 V150 H0 Z" fill="#eef1f5"/>
    </svg>
    <p>Tu dinero llega seguro</p>
    <div class="tricolor"><i style="background:#fcd116"></i><i style="background:#1b3a93"></i><i style="background:#ce1126"></i></div>
  </footer>
</main>
<script>
  const check = '<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#1fce6d"/><path d="m14 25 7 7 13-14" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  document.querySelectorAll('.servicio').forEach(s => s.insertAdjacentHTML('afterbegin', check));
</script>
</body>
</html>
