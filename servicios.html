<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VENCOL Servicios</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,600&display=block">
<style>
  :root { --navy-900: #04101f; --navy-800: #071a33; --line: rgba(255,255,255,.14); --gold: #e9b44c; --mist: #c9d6e6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: var(--navy-900); }
  body { font-family: "Montserrat", "Segoe UI", sans-serif; color: #fff; }
  .banner { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background:
      radial-gradient(900px 640px at 50% 13%, #15508f 0%, rgba(21,80,143,0) 70%),
      radial-gradient(800px 700px at 100% 66%, rgba(10,154,80,.2) 0%, rgba(10,154,80,0) 70%),
      linear-gradient(180deg, var(--navy-800), var(--navy-900)); }
  .grid { position: absolute; inset: 0; background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size: 72px 72px; }
  .map { position: absolute; pointer-events: none; opacity: .17; filter: blur(4px) drop-shadow(0 0 22px rgba(31,206,109,.55)); }
  .map.col { left: -90px; top: 100px; width: 400px; }
  .map.ven { right: -110px; top: 150px; width: 520px; }
  .contenido { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 64px 54px 0; }
  .logo { display: block; align-self: center; width: 480px; height: 480px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(248,220,151,.35), 0 0 70px rgba(66,160,255,.42), 0 22px 50px rgba(0,0,0,.55); }
  h1 { margin-top: 28px; text-align: center; font-size: 80px; font-weight: 900; line-height: 1.05; white-space: nowrap; }
  .sub { margin-top: 10px; text-align: center; font-size: 40px; font-style: italic; font-weight: 600; color: var(--mist); }
  .servicios { display: grid; gap: 12px; margin-top: 28px; }
  .service { display: flex; align-items: center; gap: 22px; height: 104px; padding: 0 28px; border: 1.5px solid var(--line); border-radius: 20px; background: rgba(12,39,72,.84); font-size: 38px; font-weight: 700; white-space: nowrap; }
  .service svg { width: 50px; height: 50px; flex: none; }
  .confianza { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 34px; }
  .confianza div { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 36px; font-weight: 800; }
  .confianza div + div { border-left: 2px solid rgba(233,180,76,.55); }
  .confianza svg { width: 44px; height: 44px; flex: none; }
  .cta { display: flex; align-items: center; justify-content: center; gap: 20px; height: 124px; margin-top: 34px; border-radius: 62px; background: linear-gradient(180deg, #2fe07f, #0fae59);
    box-shadow: 0 0 0 3px rgba(248,220,151,.75), 0 16px 42px rgba(31,206,109,.45), inset 0 2px 0 rgba(255,255,255,.4); color: #03281a; font-size: 45px; font-weight: 900; white-space: nowrap; text-decoration: none; }
  .cta svg { width: 62px; height: 62px; flex: none; }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 190px; }
  .foot svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .foot p { position: absolute; left: 0; right: 0; top: 66px; text-align: center; color: var(--navy-800); font-size: 50px; font-weight: 800; }
  .tricolor { position: absolute; left: 50%; top: 136px; width: 340px; height: 10px; margin-left: -170px; border-radius: 5px; overflow: hidden; display: flex; }
  .tricolor i { flex: 1; }
</style>
</head>
<body>
<main class="banner">
  <div class="grid"></div>
  <img class="map col" data-html2canvas-ignore src="assets/mapa-colombia.png" alt="">
  <img class="map ven" data-html2canvas-ignore src="assets/mapa-venezuela.png" alt="">

  <div class="contenido">
    <img class="logo" src="assets/logo-vencol.png" alt="VENCOL Remesas">
    <h1>Colombia a Venezuela</h1>
    <p class="sub">Conectando familias sin fronteras</p>
    <section class="servicios">
      <div class="service">Pago Móvil</div>
      <div class="service">Bancolombia</div>
      <div class="service">Nequi</div>
      <div class="service">Binance</div>
      <div class="service">Transferencia inmediata</div>
      <div class="service">Atención personalizada</div>
    </section>
    <section class="confianza">
      <div><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M27 3 9 27h13l-3 18 20-26H25z" fill="#39e585"/></svg>Rápido</div>
      <div><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="8" y="21" width="32" height="23" rx="5" fill="#e9b44c"/><path d="M15 21v-7a9 9 0 0 1 18 0v7" stroke="#e9b44c" stroke-width="4.5"/></svg>Seguro</div>
      <div><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#1fce6d"/><path d="m14 25 7 7 13-14" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>Confiable</div>
    </section>
    <a class="cta" href="https://wa.me/573105649969?text=Hola%2C%20quiero%20informaci%C3%B3n%20para%20enviar%20dinero%20con%20VENCOL%20REMESAS" target="_blank" rel="noopener">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path fill="#03281a" d="M32 4a28 28 0 0 0-24 42L4 60l14.500-3.800A28 28 0 1 0 32 4z"/>
        <path fill="#fff" d="M45.600 37.500c-.7-.4-4.200-2.100-4.900-2.300-.7-.3-1.100-.4-1.600.3-.5.700-1.800 2.300-2.300 2.800-.4.500-.8.500-1.500.2-.7-.4-3-1.100-5.700-3.500-2.100-1.900-3.500-4.200-3.900-4.900-.4-.7 0-1.100.3-1.500.3-.3.700-.8 1.100-1.200.4-.4.500-.7.700-1.200.2-.5.100-.9-.1-1.300-.2-.4-1.600-3.900-2.200-5.300-.6-1.400-1.200-1.200-1.600-1.200h-1.400c-.5 0-1.300.2-1.900.9-.7.700-2.500 2.500-2.500 6s2.600 7 2.900 7.400c.4.500 5.100 7.800 12.300 10.900 1.700.7 3.100 1.200 4.100 1.500 1.700.5 3.300.5 4.500.3 1.400-.2 4.200-1.700 4.800-3.400.6-1.700.6-3.100.4-3.400-.2-.3-.6-.5-1.300-.9z"/>
      </svg>
      Escríbenos por WhatsApp
    </a>
  </div>

  <footer class="foot">
    <svg viewBox="0 0 1080 190" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 52 Q540 -34 1080 52 V190 H0 Z" fill="#1fce6d"/>
      <path d="M0 64 Q540 -22 1080 64 V190 H0 Z" fill="#eef1f5"/>
    </svg>
    <p>Tu dinero llega seguro</p>
    <div class="tricolor"><i style="background:#fcd116"></i><i style="background:#1b3a93"></i><i style="background:#ce1126"></i></div>
  </footer>
</main>

<script src="compartir.js?v=5"></script>
<script>
  // Ajusta la pieza de 1080 px al ancho de la pantalla
  const ajustar = () => { document.documentElement.style.zoom = Math.min(1, document.documentElement.clientWidth / 1080); };
  ajustar();
  addEventListener('resize', ajustar);

  const check = '<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#1fce6d"/><path d="m14 25 7 7 13-14" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  document.querySelectorAll('.service').forEach(s => s.insertAdjacentHTML('afterbegin', check));
  prepararCompartir({ nombre: 'vencol-servicios.png', mensaje: 'VENCOL REMESAS: envíos de Colombia a Venezuela' });
</script>
</body>
</html>
